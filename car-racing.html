

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameZone - Car Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial;text-align:center}
h1{color:#39e58c;margin:16px 0 5px}
p{margin:8px}
#score{font-size:20px;color:#ffd447}
#game{position:relative;width:min(94vw,360px);height:480px;
margin:12px auto;background:#333;border:4px solid white;
overflow:hidden;border-radius:12px}
.roadline{position:absolute;left:49%;width:5px;height:55px;
background:#fff;opacity:.8}
.car{position:absolute;width:42px;height:66px;border-radius:9px;
border:3px solid white;box-shadow:inset 0 12px #222}
#player{bottom:18px;left:calc(50% - 21px);background:#21d4fd}
.enemy{background:#fa4545}
#overlay{position:absolute;inset:0;background:#000b;
display:flex;flex-direction:column;justify-content:center;
align-items:center;gap:12px}
button{border:0;border-radius:12px;padding:13px 22px;
font-size:18px;font-weight:bold;background:#39e58c;color:#102018}
.controls{display:flex;justify-content:center;gap:35px;margin:12px}
.controls button{width:100px;font-size:26px}
</style>
</head>
<body>
<h1>🏎️ GameZone Racing</h1>
<p>Dodge the cars and make your high score!</p>
<div id="score">Score: 0</div>

<div id="game">
  <div id="player" class="car"></div>
  <div id="overlay">
    <h2 id="message">Ready to Race?</h2>
    <button id="start">START GAME</button>
  </div>
</div>

<div class="controls">
  <button id="left">⬅️</button>
  <button id="right">➡️</button>
</div>
<p>Use arrow buttons to steer your car.</p>

<script>
const game=document.getElementById('game');
const player=document.getElementById('player');
const overlay=document.getElementById('overlay');
const start=document.getElementById('start');
const scoreText=document.getElementById('score');
let x=0,score=0,running=false,raf=0,last=0,spawn=0;
let enemies=[],lines=[];
const W=game.clientWidth,H=game.clientHeight,CW=42;

function move(dir){
 if(!running)return;
 x=Math.max(8,Math.min(W-CW-8,x+dir*24));
 player.style.left=x+'px';
function setupButton(id, direction) {
  const btn = document.getElementById(id);

  btn.addEventListener('pointerdown', function(event) {
    event.preventDefault();
    move(direction);
  });

  btn.addEventListener('touchstart', function(event) {
    event.preventDefault();
    move(direction);
  }, { passive: false });

  btn.addEventListener('click', function(event) {
    event.preventDefault();
    move(direction);
  });
}

setupButton('left', -1);
setupButton('right', 1);

document.onkeydown=e=>{
 if(e.key==='ArrowLeft')move(-1);
 if(e.key==='ArrowRight')move(1);
};

function reset(){
 cancelAnimationFrame(raf);
 enemies.forEach(e=>e.el.remove());
 lines.forEach(e=>e.el.remove());
 enemies=[];lines=[];score=0;spawn=0;last=0;
 x=W/2-CW/2;player.style.left=x+'px';
 scoreText.textContent='Score: 0';
 for(let i=0;i<6;i++){
  let el=document.createElement('div');
  el.className='roadline';
  game.appendChild(el);
  lines.push({el,y:i*95-30});
 }
}

function endGame(){
 running=false;
 overlay.style.display='flex';
 document.getElementById('message').textContent='Game Over! Score: '+score;
 start.textContent='PLAY AGAIN';
}

function loop(t){
 if(!running)return;
 let dt=Math.min((t-last)/16||1,2);last=t;
 lines.forEach(l=>{
  l.y+=5*dt;if(l.y>H)l.y=-55;
  l.el.style.top=l.y+'px';
 });
 spawn+=dt;
 if(spawn>48){
  spawn=0;
  let el=document.createElement('div');
  el.className='car enemy';
  let ex=12+Math.random()*(W-CW-24);
  el.style.left=ex+'px';el.style.top='-70px';
  game.appendChild(el);
  enemies.push({el,x:ex,y:-70});
 }
 enemies.forEach(e=>{
  e.y+=4*dt+Math.min(score/100,3);
  e.el.style.top=e.y+'px';
  if(e.y>H){e.y=-1000;score+=1;
   scoreText.textContent='Score: '+score;}
  if(e.y+60>H-85 && e.y<H-10 &&
     e.x<x+CW-5 && e.x+CW-5>x+5)endGame();
 });
 enemies=enemies.filter(e=>e.y>-100);
 if(running)raf=requestAnimationFrame(loop);
}
start.onclick=()=>{
 reset();overlay.style.display='none';running=true;
 raf=requestAnimationFrame(loop);
};
</script>
</body>
</html>
