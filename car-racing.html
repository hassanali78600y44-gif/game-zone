

 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameZone Car Racing</title>
<style>
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;background:#101827;color:white;font-family:Arial;text-align:center}
h1{color:#39e58c;margin:16px 0}
#score{font-size:22px;color:#ffd447;margin:12px}
#game{position:relative;width:min(94vw,360px);height:450px;margin:12px auto;background:#383838;border:4px solid white;overflow:hidden;border-radius:10px}
.line{position:absolute;left:49%;width:5px;height:55px;background:white;pointer-events:none}
.car{position:absolute;width:42px;height:65px;border:3px solid white;border-radius:8px;pointer-events:none}
#player{background:#20cfff;bottom:15px;left:150px}
.enemy{background:#fa4545}
#overlay{position:absolute;inset:0;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
button{padding:14px 22px;border:0;border-radius:12px;background:#39e58c;color:#102018;font-size:20px;font-weight:bold;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.controls{display:flex;justify-content:center;gap:30px;margin:16px}
.controls button{width:110px;height:65px;font-size:27px}
</style>
</head>
<body>
<h1>🏎️ GameZone Racing</h1>
<p>Doosri cars se bachao!</p>
<div id="score">Score: 0</div>

<div id="game">
  <div id="player" class="car"></div>
  <div id="overlay">
    <h2 id="msg">Ready to Race?</h2>
    <button id="start">START GAME</button>
  </div>
</div>

<div class="controls">
  <button id="left" type="button">⬅️ LEFT</button>
  <button id="right" type="button">RIGHT ➡️</button>
</div>
<p>Car chalane ke liye LEFT aur RIGHT dabao.</p>

<script>
const game=document.getElementById('game');
const player=document.getElementById('player');
const overlay=document.getElementById('overlay');
const start=document.getElementById('start');
const scoreText=document.getElementById('score');

let x=0,score=0,running=false,last=0,spawn=0,raf=0;
let enemies=[],lines=[];

function move(direction){
  if(!running)return;
  x=Math.max(5,Math.min(game.clientWidth-47,x+direction*25));
  player.style.left=x+'px';
}

/* Mobile buttons: pointer, touch and click support */
function setupButton(id,direction){
  const button=document.getElementById(id);
  button.addEventListener('pointerdown',function(e){
    e.preventDefault();
    move(direction);
  });
  button.addEventListener('click',function(e){
    e.preventDefault();
    move(direction);
  });
}
setupButton('left',-1);
setupButton('right',1);

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft')move(-1);
  if(e.key==='ArrowRight')move(1);
});

function reset(){
  cancelAnimationFrame(raf);
  enemies.forEach(e=>e.el.remove());
  lines.forEach(l=>l.el.remove());
  enemies=[];lines=[];
  score=0;spawn=0;last=0;
  scoreText.textContent='Score: 0';
  x=game.clientWidth/2-21;
  player.style.left=x+'px';

  for(let i=0;i<6;i++){
    const el=document.createElement('div');
    el.className='line';
    game.appendChild(el);
    lines.push({el:el,y:i*90-40});
  }
}

function gameOver(){
  running=false;
  overlay.style.display='flex';
  document.getElementById('msg').textContent='Game Over! Score: '+score;
  start.textContent='PLAY AGAIN';
}

function loop(t){
  if(!running)return;
  const dt=Math.min((t-last)/16||1,2);
  last=t;

  lines.forEach(l=>{
    l.y+=5*dt;
    if(l.y>450)l.y=-55;
    l.el.style.top=l.y+'px';
  });

  spawn+=dt;
  if(spawn>48){
    spawn=0;
    const el=document.createElement('div');
    el.className='car enemy';
    const ex=8+Math.random()*(game.clientWidth-58);
    el.style.left=ex+'px';
    el.style.top='-70px';
    game.appendChild(el);
    enemies.push({el:el,x:ex,y:-70,passed:false});
  }

  for(const e of enemies){
    e.y+=5*dt+Math.min(score/100,3);
    e.el.style.top=e.y+'px';

    if(e.y>450&&!e.passed){
      e.passed=true;
      score++;
      scoreText.textContent='Score: '+score;
    }

    if(e.y>450-90&&e.y<450-15&&
       e.x<x+37&&e.x+37>x+5){
      gameOver();
      break;
    }
  }

  enemies=enemies.filter(e=>e.y<500);
  if(running)raf=requestAnimationFrame(loop);
}

start.addEventListener('click',function(){
  reset();
  overlay.style.display='none';
  running=true;
  raf=requestAnimationFrame(loop);
});
</script>
</body>
</html>
