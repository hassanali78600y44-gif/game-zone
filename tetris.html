
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameZone - Tetris</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#0b1020;color:white;
  font-family:Arial,sans-serif;text-align:center;
}
header{padding:16px;background:#151d35}
h1{margin:0;color:#38e8ff}
a{color:#38e8ff;text-decoration:none}
.wrap{max-width:420px;margin:auto;padding:14px}
.stats{display:flex;justify-content:space-around;gap:8px;margin:12px 0}
.panel{background:#18223d;padding:10px;border-radius:10px;flex:1}
canvas{
  display:block;margin:0 auto;background:#080d19;
  border:2px solid #38e8ff;border-radius:6px;
  width:min(100%,300px);height:auto;
}
button{
  border:0;border-radius:10px;padding:13px 17px;
  background:#26375e;color:white;font-size:17px;
  font-weight:bold;cursor:pointer;touch-action:manipulation;
}
button:active{background:#087eaa}
.actions{display:flex;justify-content:center;gap:10px;margin:12px 0}
.controls{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:9px;max-width:300px;margin:14px auto;
}
.controls button{padding:15px 4px;font-size:21px}
.help{color:#c5cde2;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>🎮 GAMEZONE</h1>
  <p><a href="index.html">← Back to Home</a></p>
</header>

<main class="wrap">
  <h2>🧱 TETRIS</h2>
  <div class="stats">
    <div class="panel">Score<br><strong id="score">0</strong></div>
    <div class="panel">Lines<br><strong id="lines">0</strong></div>
    <div class="panel">Level<br><strong id="level">1</strong></div>
  </div>

  <canvas id="game" width="300" height="600"></canvas>

  <div class="actions">
    <button id="start">▶ Start / Restart</button>
    <button id="pause">⏸ Pause</button>
  </div>

  <div class="controls">
    <span></span>
    <button id="rotate" aria-label="Rotate">↻</button>
    <span></span>
    <button id="left" aria-label="Move left">⬅</button>
    <button id="down" aria-label="Move down">⬇</button>
    <button id="right" aria-label="Move right">➡</button>
  </div>

  <p id="message">Start dabao aur game khelo!</p>
  <p class="help">
    Keyboard: ← → move, ↑ rotate, ↓ fast drop, Space = drop,
    P = pause.<br>
    Mobile: neeche diye gaye buttons use karo.
  </p>
</main>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const COLS = 10, ROWS = 20, SIZE = 30;

  const colors = [
    null, "#35d9ff", "#4778ff", "#ff9f43",
    "#ffe04b", "#b45cff", "#48ed91", "#ff5577"
  ];

  const shapes = [
    [],
    [[1,1,1,1]],
    [[2,0,0],[2,2,2]],
    [[0,0,3],[3,3,3]],
    [[4,4],[4,4]],
    [[0,5,5],[5,5,0]],
    [[0,6,0],[6,6,6]],
    [[7,7,0],[0,7,7]]
  ];

  let board, piece, score, lines, level;
  let running = false, paused = false, ended = false;
  let lastTime = 0, dropTime = 0, animation = 0;

  function newBoard() {
    return Array.from({length: ROWS}, () => Array(COLS).fill(0));
  }

  function randomPiece() {
    const id = 1 + Math.floor(Math.random() * 7);
    const matrix = shapes[id].map(row => row.slice());
    return {
      matrix, id,
      x: Math.floor((COLS - matrix[0].length) / 2),
      y: 0
    };
  }

  function collide(p, dx=0, dy=0, matrix=p.matrix) {
    for (let y=0; y<matrix.length; y++) {
      for (let x=0; x<matrix[y].length; x++) {
        if (!matrix[y][x]) continue;
        const nx = p.x + x + dx, ny = p.y + y + dy;
        if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
        if (ny >= 0 && board[ny][nx]) return true;
      }
    }
    return false;
  }

  function drawCell(x, y, id) {
    ctx.fillStyle = colors[id];
    ctx.fillRect(x*SIZE+1, y*SIZE+1, SIZE-2, SIZE-2);
    ctx.fillStyle = "rgba(255,255,255,.22)";
    ctx.fillRect(x*SIZE+3, y*SIZE+3, SIZE-6, 3);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#080d19";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#1a2540";
    ctx.lineWidth = 1;
    for (let x=0; x<=COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x*SIZE,0);
      ctx.lineTo(x*SIZE,canvas.height); ctx.stroke();
    }
    for (let y=0; y<=ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0,y*SIZE);
      ctx.lineTo(canvas.width,y*SIZE); ctx.stroke();
    }

    if (board) {
      board.forEach((row,y) => row.forEach((id,x) => {
        if (id) drawCell(x,y,id);
      }));
    }

    if (piece) {
      piece.matrix.forEach((row,y) => row.forEach((id,x) => {
        if (id) {
          const py = piece.y+y;
          if (py >= 0) drawCell(piece.x+x,py,id);
        }
      }));
    }

    if (paused || ended) {
      ctx.fillStyle = "rgba(0,0,0,.72)";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.font = "bold 25px Arial";
      ctx.fillText(ended ? "GAME OVER" : "PAUSED",150,285);
      ctx.font = "15px Arial";
      ctx.fillText(ended ? "Press Start to play again" : "Press Resume to continue",150,315);
    }
  }

  function updateStats() {
    document.getElementById("score").textContent = score;
    document.getElementById("lines").textContent = lines;
    document.getElementById("level").textContent = level;
  }

  function spawn() {
    piece = randomPiece();
    if (collide(piece)) {
      ended = true;
      running = false;
      document.getElementById("message").textContent =
        "Game Over! Start dabao aur dobara khelo.";
    }
  }

  function lockPiece() {
    piece.matrix.forEach((row,y) => row.forEach((id,x) => {
      if (id && piece.y+y >= 0) {
        board[piece.y+y][piece.x+x] = id;
      }
    }));

    let cleared = 0;
    for (let y=ROWS-1; y>=0; y--) {
      if (board[y].every(cell => cell !== 0)) {
        board.splice(y,1);
        board.unshift(Array(COLS).fill(0));
        cleared++;
        y++;
      }
    }

    if (cleared) {
      const points = [0,100,300,500,800];
      score += points[cleared] * level;
      lines += cleared;
      level = Math.floor(lines/10)+1;
      updateStats();
    }
    spawn();
  }

  function move(dx,dy) {
    if (!running || paused || ended) return;
    if (!collide(piece,dx,dy)) {
      piece.x += dx;
      piece.y += dy;
      return true;
    }
    if (dy > 0) lockPiece();
    return false;
  }

  function rotate() {
    if (!running || paused || ended) return;
    const rotated = piece.matrix[0].map((_,i) =>
      piece.matrix.map(row => row[i]).reverse()
    );
    for (const kick of [0,-1,1,-2,2]) {
      if (!collide(piece,kick,0,rotated)) {
        piece.x += kick;
        piece.matrix = rotated;
        return;
      }
    }
  }

  function hardDrop() {
    if (!running || paused || ended) return;
    while (!collide(piece,0,1)) {
      piece.y++;
      score += 2;
    }
    updateStats();
    lockPiece();
  }

  function loop(time=0) {
    const delta = time-lastTime;
    lastTime = time;
    if (running && !paused && !ended) {
      dropTime += delta;
      if (dropTime > Math.max(100, 700-(level-1)*55)) {
        move(0,1);
        dropTime = 0;
      }
    }
    draw();
    animation = requestAnimationFrame(loop);
  }

  function startGame() {
    cancelAnimationFrame(animation);
    board = newBoard();
    score = 0; lines = 0; level = 1;
    paused = false; ended = false; running = true;
    dropTime = 0; lastTime = 0;
    updateStats();
    spawn();
    document.getElementById("message").textContent = "Game shuru ho gayi!";
    animation = requestAnimationFrame(loop);
  }

  document.getElementById("start").addEventListener("click",startGame);
  document.getElementById("pause").addEventListener("click",() => {
    if (!running || ended) return;
    paused = !paused;
    document.getElementById("pause").textContent =
      paused ? "▶ Resume" : "⏸ Pause";
    document.getElementById("message").textContent =
      paused ? "Game paused hai." : "Game jaari hai!";
  });

  document.getElementById("left").addEventListener("click",()=>move(-1,0));
  document.getElementById("right").addEventListener("click",()=>move(1,0));
  document.getElementById("down").addEventListener("click",()=>{
    if (move(0,1)) { score++; updateStats(); }
  });
  document.getElementById("rotate").addEventListener("click",rotate);

  document.addEventListener("keydown",e => {
    if (["ArrowLeft","ArrowRight","ArrowDown","ArrowUp"," "].includes(e.key)) {
      e.preventDefault();
    }
    if (e.key === "ArrowLeft") move(-1,0);
    if (e.key === "ArrowRight") move(1,0);
    if (e.key === "ArrowDown") {
      if (move(0,1)) { score++; updateStats(); }
    }
    if (e.key === "ArrowUp") rotate();
    if (e.key === " ") hardDrop();
    if (e.key.toLowerCase() === "p") {
      document.getElementById("pause").click();
    }
  });

  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener("touchstart",e => {
    touchStartX = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
  },{passive:true});
  canvas.addEventListener("touchend",e => {
    const dx = e.changedTouches[0].clientX-touchStartX;
    const dy = e.changedTouches[0].clientY-touchStartY;
    if (Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>20) {
      move(dx>0 ? 1 : -1,0);
    } else if (dy>25) {
      move(0,1);
    } else if (dy < -20) {
      rotate();
    }
  },{passive:true});

  board = newBoard();
  score = 0; lines = 0; level = 1;
  updateStats();
  spawn();
  draw();
  animation = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
