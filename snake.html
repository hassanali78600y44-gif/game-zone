
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameZone Snake Game</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px 10px;background:#101827;color:white;
 font-family:Arial,sans-serif;text-align:center
}
h1{color:#39e58c;margin:10px 0}
p{color:#d4dce8}
#score{font-size:23px;color:#ffd447;margin:15px}
#board{
 display:block;width:min(92vw,360px);height:min(92vw,360px);
 margin:15px auto;background:#172b32;
 border:3px solid #39e58c;border-radius:10px;
 touch-action:none
}
button{
 border:0;border-radius:12px;padding:14px 18px;
 background:#39e58c;color:#102018;font-weight:bold;
 font-size:18px;touch-action:manipulation
}
#restart{background:#ffd447;margin:8px}
.pad{
 display:grid;grid-template-columns:65px 65px 65px;
 grid-template-rows:55px 55px;gap:7px;
 justify-content:center;margin:16px auto
}
.pad button{padding:8px;font-size:23px}
.up{grid-column:2;grid-row:1}
.left{grid-column:1;grid-row:2}
.down{grid-column:2;grid-row:2}
.right{grid-column:3;grid-row:2}
</style>
</head>
<body>
<h1>🐍 GameZone Snake</h1>
<p>Apple khao aur apna score barhao!</p>
<div id="score">Score: 0</div>

<canvas id="board" width="360" height="360"></canvas>

<div class="pad">
 <button class="up" data-dir="up">⬆️</button>
 <button class="left" data-dir="left">⬅️</button>
 <button class="down" data-dir="down">⬇️</button>
 <button class="right" data-dir="right">➡️</button>
</div>

<button id="restart">🔄 Start / Restart</button>
<p id="message">Start dabao aur game khelo!</p>
<p>Mobile par arrows dabao ya game par swipe karo.</p>

<script>
const canvas=document.getElementById('board');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const message=document.getElementById('message');
const size=18, total=20;

let snake,food,dx,dy,score,running,gameOver,timer;

function randomFood(){
 let f;
 do{
  f={x:Math.floor(Math.random()*total),
     y:Math.floor(Math.random()*total)};
 }while(snake.some(s=>s.x===f.x&&s.y===f.y));
 return f;
}

function draw(){
 ctx.fillStyle='#172b32';
 ctx.fillRect(0,0,360,360);

 ctx.strokeStyle='#203a40';
 for(let i=0;i<=360;i+=size){
  ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,360);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(360,i);ctx.stroke();
 }

 ctx.fillStyle='#ff5252';
 ctx.beginPath();
 ctx.arc(food.x*size+9,food.y*size+9,7,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle='#55df75';
 ctx.fillRect(food.x*size+7,food.y*size+1,4,5);

 snake.forEach((s,i)=>{
  ctx.fillStyle=i===0?'#39e58c':'#20b86a';
  ctx.fillRect(s.x*size+1,s.y*size+1,size-2,size-2);
  if(i===0){
   ctx.fillStyle='#102018';
   ctx.fillRect(s.x*size+4,s.y*size+4,3,3);
   ctx.fillRect(s.x*size+11,s.y*size+4,3,3);
  }
 });
}

function startGame(){
 clearInterval(timer);
 snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
 dx=1;dy=0;score=0;running=true;gameOver=false;
 food=randomFood();
 scoreEl.textContent='Score: 0';
 message.textContent='Good luck! 🍎';
 draw();
 timer=setInterval(step,140);
}

function changeDir(dir){
 if(!running)return;
 if(dir==='up'&&dy!==1){dx=0;dy=-1}
 else if(dir==='down'&&dy!==-1){dx=0;dy=1}
 else if(dir==='left'&&dx!==1){dx=-1;dy=0}
 else if(dir==='right'&&dx!==-1){dx=1;dy=0}
}

document.querySelectorAll('[data-dir]').forEach(btn=>{
 btn.addEventListener('pointerdown',e=>{
  e.preventDefault();
  changeDir(btn.dataset.dir);
 });
});

document.addEventListener('keydown',e=>{
 const keys={
  ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',
  ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'
 };
 if(keys[e.key]){
  e.preventDefault();
  changeDir(keys[e.key]);
 }
});

let touchX=0,touchY=0;
canvas.addEventListener('pointerdown',e=>{
 touchX=e.clientX;touchY=e.clientY;
});
canvas.addEventListener('pointerup',e=>{
 const ax=e.clientX-touchX,ay=e.clientY-touchY;
 if(Math.max(Math.abs(ax),Math.abs(ay))<18)return;
 if(Math.abs(ax)>Math.abs(ay))
  changeDir(ax>0?'right':'left');
 else changeDir(ay>0?'down':'up');
});

function step(){
 if(!running)return;
 const head={x:snake[0].x+dx,y:snake[0].y+dy};

 if(head.x<0||head.x>=total||head.y<0||head.y>=total||
    snake.some(s=>s.x===head.x&&s.y===head.y)){
  running=false;gameOver=true;clearInterval(timer);
  message.textContent='Game Over! Restart dabao.';
  draw();
  ctx.fillStyle='white';ctx.textAlign='center';
  ctx.font='bold 23px Arial';
  ctx.fillText('GAME OVER',180,180);
  return;
 }

 snake.unshift(head);

 if(head.x===food.x&&head.y===food.y){
  score++;
  scoreEl.textContent='Score: '+score;
  food=randomFood();
 }else snake.pop();

 draw();
}

document.getElementById('restart').addEventListener('click',startGame);
draw();
</script>
</body>
  </html>
